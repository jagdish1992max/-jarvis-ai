<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. AI</title>
<style>
  :root { --c: #00f3ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050a14; color: var(--c); font-family: sans-serif; padding: 15px; text-align: center; }
  header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--c); margin-bottom: 15px; }
  .logo { font-size: 1.4rem; font-weight: bold; letter-spacing: 2px; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
  
  .box { background: rgba(255,255,255,0.05); border: 1px solid var(--c); border-radius: 10px; padding: 15px; max-width: 480px; margin: 0 auto 15px; }
  #msg { color: #fff; font-size: 1rem; min-height: 45px; margin-bottom: 12px; line-height: 1.4; }
  
  .row { display: flex; gap: 6px; margin-bottom: 10px; }
  input { flex: 1; padding: 10px; background: #000; border: 1px solid var(--c); color: #fff; border-radius: 5px; font-size: 0.9rem; }
  button, a.chip { padding: 10px 14px; background: var(--c); color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
  
  .grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  a.chip, button.chip { background: rgba(0,243,255,0.12); color: var(--c); border: 1px solid var(--c); border-radius: 20px; padding: 6px 12px; }
  
  details { text-align: left; max-width: 480px; margin: 0 auto 15px; background: #081224; border: 1px solid var(--c); border-radius: 8px; padding: 10px; }
  summary { font-weight: bold; cursor: pointer; padding: 5px; }
  .setup-body { margin-top: 10px; }
  .setup-body input { width: 100%; margin-bottom: 8px; }
</style>
</head>
<body>

  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="dots">
      <div class="dot" style="background:#00f3ff" onclick="document.documentElement.style.setProperty('--c','#00f3ff')"></div>
      <div class="dot" style="background:#ff2a2a" onclick="document.documentElement.style.setProperty('--c','#ff2a2a')"></div>
      <div class="dot" style="background:#00ff66" onclick="document.documentElement.style.setProperty('--c','#00ff66')"></div>
    </div>
  </header>

  <details open>
    <summary>⚙️ SETTINGS (Naam & API Key Yahan Dalein)</summary>
    <div class="setup-body">
      <input type="text" id="uname" placeholder="Apna naam likhein (jaise: JD Butiya)">
      <input type="text" id="ukey" placeholder="Gemini (AIzaSy...) ya OpenRouter (sk-or-...) Key">
      <button onclick="saveData()" style="width:100%">SAVE SETTINGS</button>
    </div>
  </details>

  <div class="box">
    <div id="msg">System Ready, Sir. Niche command likhein ya button dabayein.</div>
    
    <div class="row">
      <input type="text" id="cmd" placeholder="Sawal puchein, 25*10, ya 'play song'...">
      <button onclick="runCmd()">SEND</button>
    </div>

    <div class="grid">
      <button class="chip" onclick="startMic()">🎤 BOL KAR PUCHEIN</button>
      <button class="chip" onclick="quick('time')">⏰ TIME</button>
      <button class="chip" onclick="quick('play arijit singh songs')">🎵 PLAY SONG</button>
    </div>
  </div>

  <div class="box">
    <div style="font-size:0.75rem; margin-bottom:8px;">DIRECT APPS & SOCIAL MEDIA</div>
    <div class="grid">
      <a class="chip" href="https://instagram.com" target="_blank">Instagram</a>
      <a class="chip" href="https://whatsapp.com" target="_blank">WhatsApp</a>
      <a class="chip" href="https://youtube.com" target="_blank">YouTube</a>
      <a class="chip" href="https://facebook.com" target="_blank">Facebook</a>
      <a class="chip" href="https://x.com" target="_blank">X</a>
      <a class="chip" href="https://telegram.org" target="_blank">Telegram</a>
      <a class="chip" href="https://snapchat.com" target="_blank">Snapchat</a>
      <a class="chip" href="https://linkedin.com" target="_blank">LinkedIn</a>
    </div>
  </div>

  <script>
    document.getElementById('uname').value = localStorage.getItem('j_name') || '';
    document.getElementById('ukey').value = localStorage.getItem('j_key') || '';

    function say(t) {
      document.getElementById('msg').innerText = t;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let s = new SpeechSynthesisUtterance(t);
        s.lang = 'hi-IN';
        window.speechSynthesis.speak(s);
      }
    }

    function saveData() {
      let n = document.getElementById('uname').value.trim() || 'Sir';
      let k = document.getElementById('ukey').value.replace(/[`'"]/g, '').trim();
      document.getElementById('ukey').value = k;
      localStorage.setItem('j_name', n);
      localStorage.setItem('j_key', k);
      say('Settings save ho gayi hain, ' + n + '!');
    }

    function quick(c) {
      document.getElementById('cmd').value = c;
      runCmd();
    }

    async function runCmd() {
      let input = document.getElementById('cmd');
      let raw = input.value.trim();
      let c = raw.toLowerCase();
      let name = localStorage.getItem('j_name') || 'Sir';
      let key = (localStorage.getItem('j_key') || '').replace(/[`'"]/g, '').trim();
      input.value = '';
      if (!c) return;

      if (c === 'time') {
        say('Abhi time hua hai ' + new Date().toLocaleTimeString());
      } else if (c.startsWith('play ')) {
        let song = raw.slice(5);
        say('YouTube par ' + song + ' khol raha hoon.');
        window.location.href = 'https://youtube.com/results?search_query=' + encodeURIComponent(song);
      } else if (/^[0-9+\-*/().\s]+$/.test(c)) {
        try { say('Jawab hai: ' + eval(c)); } catch(e) { say('Galat hisab hai.'); }
      } else if (key.startsWith('AIza')) {
        document.getElementById('msg').innerText = 'Soch raha hoon...';
        try {
          let r = await fetch('https://googleapis.com' + key, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: 'Short Hinglish reply to ' + name + ': ' + raw }] }] })
          });
          let d = await r.json();
          if (d.error) {
            say('Gemini Error: ' + d.error.message);
          } else {
            say(d.candidates[0].content.parts[0].text.replace(/\*/g, ''));
          }
        } catch(e) {
          say('Internet error aa raha hai.');
        }
      } else if (key.startsWith('sk-or-')) {
        document.getElementById('msg').innerText = 'Soch raha hoon...';
        try {
          let r = await fetch('https://openrouter.ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
            body: JSON.stringify({ model: 'google/gemini-2.0-flash-exp:free', messages: [{ role: 'user', content: 'Short Hinglish reply to ' + name + ': ' + raw }] })
          });
          let d = await r.json();
          if (d.error) {
            say('OpenRouter Error: ' + d.error.message);
          } else {
            say(d.choices[0].message.content.replace(/\*/g, ''));
          }
        } catch(e) {
          say('Internet error aa raha hai.');
        }
      } else if (key !== '') {
        say('Yeh galat API Key hai. Gemini Key "AIza" se ya OpenRouter Key "sk-or-" se shuru hoti hai.');
      } else {
        say('Google par search kar raha hoon: ' + raw);
        window.location.href = 'https://google.com' + encodeURIComponent(raw);
      }
    }

    function startMic() {
      let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { say('Is browser mein mic nahi chalega, type karein.'); return; }
      let rec = new SR();
      rec.lang = 'en-IN';
      document.getElementById('msg').innerText = 'Listening... Boliye...';
      rec.start();
      rec.onresult = function(e) {
        document.getElementById('cmd').value = e.results[0][0].transcript;
        runCmd();
      };
    }
  </script>
</body>
</html>
