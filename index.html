<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a14">
<title>J.A.R.V.I.S. Ultimate AI</title>
<style>
  :root {
    --theme-color: #00f3ff;
    --theme-bg: rgba(0, 243, 255, 0.12);
    --theme-glow: rgba(0, 243, 255, 0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #050a14;
    color: var(--theme-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background-image: radial-gradient(circle at center, var(--theme-bg) 0%, #050a14 80%);
    transition: 0.3s;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--theme-glow);
  }
  .logo {
    font-size: 1.3rem;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 10px var(--theme-color);
  }
  .top-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .theme-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #fff;
  }
  .api-btn {
    background: var(--theme-bg);
    color: var(--theme-color);
    border: 1px solid var(--theme-color);
    padding: 5px 10px;
    font-size: 0.75rem;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 15px;
    flex-grow: 1;
  }
  .jarvis-core {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    cursor: pointer;
  }
  .ring { position: absolute; border-radius: 50%; pointer-events: none; }
  .ring-1 {
    width: 135px; height: 135px;
    border: 3px solid transparent;
    border-top: 3px solid var(--theme-color);
    border-bottom: 3px solid var(--theme-color);
    animation: spin 6s linear infinite;
    box-shadow: 0 0 15px var(--theme-glow);
  }
  .ring-2 {
    width: 105px; height: 105px;
    border: 2px dashed var(--theme-color);
    animation: spin-rev 4s linear infinite;
  }
  .core-center {
    width: 65px; height: 65px;
    background: radial-gradient(circle, #ffffff, var(--theme-color), #001f3f);
    border-radius: 50%;
    box-shadow: 0 0 25px var(--theme-color);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #050a14;
    font-weight: bold;
    font-size: 0.7rem;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes spin-rev { 100% { transform: rotate(-360deg); } }

  .chat-box {
    width: 100%;
    max-width: 500px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--theme-glow);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
  }
  #jarvis-msg {
    font-size: 0.95rem;
    color: #ffffff;
    min-height: 45px;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input {
    flex-grow: 1;
    padding: 10px;
    background: #02050a;
    border: 1px solid var(--theme-color);
    color: #fff;
    border-radius: 5px;
    outline: none;
    font-size: 0.9rem;
  }
  .btn-jarvis {
    padding: 10px 15px;
    background: var(--theme-color);
    color: #050a14;
    border: none;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
  }
  .section-label {
    font-size: 0.7rem;
    letter-spacing: 1px;
    opacity: 0.85;
    margin: 12px 0 6px;
    text-transform: uppercase;
  }
  .quick-cmds {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    justify-content: center;
  }
  .cmd-chip {
    padding: 6px 12px;
    background: var(--theme-bg);
    border: 1px solid var(--theme-glow);
    color: var(--theme-color);
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 15px;
    text-decoration: none;
    display: inline-block;
  }
  .cmd-chip:active {
    background: var(--theme-color);
    color: #050a14;
  }
  .notes-area {
    width: 100%;
    max-width: 500px;
    text-align: left;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--theme-glow);
    padding: 12px;
    border-radius: 8px;
    font-size: 0.85rem;
  }
  .notes-area ul { list-style: none; margin-top: 6px; }
  .notes-area li {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  footer {
    text-align: center;
    padding: 10px;
    border-top: 1px solid var(--theme-glow);
    font-size: 0.75rem;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="top-controls">
      <div class="theme-dot" style="background:#00f3ff;" onclick="setTheme('#00f3ff', 'rgba(0,243,255,0.12)', 'rgba(0,243,255,0.5)')"></div>
      <div class="theme-dot" style="background:#ff2a2a;" onclick="setTheme('#ff2a2a', 'rgba(255,42,42,0.12)', 'rgba(255,42,42,0.5)')"></div>
      <div class="theme-dot" style="background:#00ff66;" onclick="setTheme('#00ff66', 'rgba(0,255,102,0.12)', 'rgba(0,255,102,0.5)')"></div>
      <button class="api-btn" onclick="setupUser()">⚙️ SETUP</button>
    </div>
  </header>

  <section class="hero">
    <div class="jarvis-core" onclick="startVoice()">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="core-center">TAP MIC</div>
    </div>

    <div class="chat-box">
      <div id="jarvis-msg">System Online, Sir. Main aapki kya madad kar sakta hoon?</div>
      <div class="input-group">
        <input type="text" id="user-input" placeholder="Likhein: 25*10, play song, ya sawal..." onkeypress="if(event.key==='Enter') processCommand()">
        <button class="btn-jarvis" onclick="processCommand()">SEND</button>
      </div>
      
      <div class="section-label">Social Media & Apps (Direct Open)</div>
      <div class="quick-cmds">
        <a class="cmd-chip" href="https://instagram.com" target="_blank" onclick="speak('Instagram khol raha hoon, Sir.')">Instagram</a>
        <a class="cmd-chip" href="https://whatsapp.com" target="_blank" onclick="speak('WhatsApp khol raha hoon, Sir.')">WhatsApp</a>
        <a class="cmd-chip" href="https://youtube.com" target="_blank" onclick="speak('YouTube khol raha hoon, Sir.')">YouTube</a>
        <a class="cmd-chip" href="https://facebook.com" target="_blank" onclick="speak('Facebook khol raha hoon, Sir.')">Facebook</a>
        <a class="cmd-chip" href="https://x.com" target="_blank" onclick="speak('X khol raha hoon, Sir.')">X</a>
        <a class="cmd-chip" href="https://telegram.org" target="_blank" onclick="speak('Telegram khol raha hoon, Sir.')">Telegram</a>
        <a class="cmd-chip" href="https://snapchat.com" target="_blank" onclick="speak('Snapchat khol raha hoon, Sir.')">Snapchat</a>
        <a class="cmd-chip" href="https://linkedin.com" target="_blank" onclick="speak('LinkedIn khol raha hoon, Sir.')">LinkedIn</a>
      </div>

      <div class="section-label">Smart Commands</div>
      <div class="quick-cmds">
        <button class="cmd-chip" onclick="runQuick('time')">⏰ Time</button>
        <a class="cmd-chip" href="https://google.com" target="_blank" onclick="speak('Mausam ki jankari khol raha hoon.')">🌦️ Weather</a>
        <button class="cmd-chip" onclick="runQuick('play arijit singh songs')">🎵 Play Song</button>
        <button class="cmd-chip" onclick="runQuick('note: call home at 7pm')">📝 Add Note</button>
      </div>
    </div>

    <div class="notes-area">
      <strong>📌 SAVED NOTES:</strong>
      <ul id="notes-list"></ul>
    </div>
  </section>

  <footer>
    <span id="battery-status">BATTERY: ONLINE</span> | <span id="clock">TIME: 00:00:00</span>
  </footer>

  <script>
    let userName = localStorage.getItem('jarvis_user') || 'Sir';
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let notes = JSON.parse(localStorage.getItem('jarvis_notes')) || ['Welcome to J.A.R.V.I.S.'];

    function init() {
      document.getElementById('jarvis-msg').innerText = `Welcome back, ${userName}. All systems operational.`;
      renderNotes();
    }

    function setTheme(color, bg, glow) {
      document.documentElement.style.setProperty('--theme-color', color);
      document.documentElement.style.setProperty('--theme-bg', bg);
      document.documentElement.style.setProperty('--theme-glow', glow);
    }

    function setupUser() {
      const name = prompt("Apna naam likhein:", userName);
      if (name && name.trim() !== "") {
        userName = name.trim();
        localStorage.setItem('jarvis_user', userName);
      }
      const key = prompt("Apni Gemini API Key paste karein (ya khali chhod dein):", apiKey);
      if (key !== null) {
        apiKey = key.trim();
        localStorage.setItem('gemini_api_key', apiKey);
      }
      speak(`Settings saved, ${userName}.`);
    }

    function speak(text) {
      document.getElementById('jarvis-msg').innerText = text;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'hi-IN';
        window.speechSynthesis.speak(speech);
      }
    }

    function updateClock() {
      document.getElementById('clock').innerText = 'TIME: ' + new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    if ('getBattery' in navigator) {
      navigator.getBattery().then(b => {
        const up = () => document.getElementById('battery-status').innerText = 'BATTERY: ' + Math.round(b.level * 100) + '%';
        up(); b.addEventListener('levelchange', up);
      });
    }

    function renderNotes() {
      const list = document.getElementById('notes-list');
