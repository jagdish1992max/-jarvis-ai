<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #050a14;
    color: #00f3ff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background-image: radial-gradient(circle at center, rgba(0, 243, 255, 0.15) 0%, #050a14 75%);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid rgba(0, 243, 255, 0.3);
  }
  .logo {
    font-size: 1.5rem;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 0 10px #00f3ff;
  }
  .hero {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    text-align: center;
    padding: 30px 20px;
  }
  .status-badge {
    display: inline-block;
    padding: 5px 15px;
    border: 1px solid #00f3ff;
    font-size: 0.85rem;
    letter-spacing: 2px;
    margin-bottom: 20px;
    background: rgba(0, 243, 255, 0.1);
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 15px;
    text-shadow: 0 0 15px rgba(0, 243, 255, 0.7);
  }
  p {
    font-size: 1.1rem;
    color: #a0d8ef;
    margin-bottom: 25px;
    line-height: 1.5;
    max-width: 500px;
  }
  .btn-jarvis {
    padding: 15px 30px;
    background: rgba(0, 243, 255, 0.1);
    color: #00f3ff;
    border: 2px solid #00f3ff;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
  }
  .btn-jarvis:active {
    background: #00f3ff;
    color: #050a14;
  }
  .jarvis-core {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
  }
  .ring {
    position: absolute;
    border-radius: 50%;
  }
  .ring-1 {
    width: 210px;
    height: 210px;
    border: 3px solid transparent;
    border-top: 3px solid #00f3ff;
    border-bottom: 3px solid #00f3ff;
    animation: spin 6s linear infinite;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
  }
  .ring-2 {
    width: 165px;
    height: 165px;
    border: 3px dashed #00f3ff;
    animation: spin-rev 4s linear infinite;
  }
  .core-center {
    width: 90px;
    height: 90px;
    background: radial-gradient(circle, #ffffff, #00f3ff, #0051ff);
    border-radius: 50%;
    box-shadow: 0 0 35px #00f3ff;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #050a14;
    font-weight: bold;
    font-size: 0.85rem;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
  footer {
    text-align: center;
    padding: 15px;
    border-top: 1px solid rgba(0, 243, 255, 0.3);
    font-size: 0.85rem;
    color: #5bc0de;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div style="font-size: 0.8rem;">ONLINE</div>
  </header>

  <section class="hero">
    <div>
      <div class="status-badge">● SYSTEM ONLINE | V 4.02</div>
      <h1>NEXT-GEN AI ASSISTANT</h1>
      <p id="jarvis-msg">Welcome back, Sir. All neural networks and security protocols are fully operational. Ready for your command.</p>
      <button class="btn-jarvis" onclick="activateJarvis()">INITIALIZE PROTOCOL</button>
    </div>

    <div class="jarvis-core">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="core-center">AI CORE</div>
    </div>
  </section>

  <footer>
    <div>CPU LOAD: 14% | MEMORY: OPTIMAL</div>
    <div id="clock">TIME: 00:00:00</div>
    <div>STARK INDUSTRIES INTERFACE</div>
  </footer>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = 'TIME: ' + now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function activateJarvis() {
      const msg = document.getElementById('jarvis-msg');
      msg.innerText = "Scanning environment... Protocols initiated. How may I assist you today, Sir?";
      if ('speechSynthesis' in window) {
        const speech = new SpeechSynthesisUtterance("Protocols initiated. How may I assist you today, Sir?");
        window.speechSynthesis.speak(speech);
      }
    }
  </script>
</body>
</html>
