<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a14">
<title>J.A.R.V.I.S. Ultimate AI</title>
<style>
  :root {
    --theme-color: #00f3ff;
    --theme-bg: rgba(0, 243, 255, 0.1);
    --theme-glow: rgba(0, 243, 255, 0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #050a14;
    color: var(--theme-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background-image: radial-gradient(circle at center, var(--theme-bg) 0%, #050a14 80%);
    transition: 0.4s;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--theme-glow);
  }
  .logo {
    font-size: 1.3rem;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 10px var(--theme-color);
  }
  .top-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .theme-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #fff;
  }
  .api-btn {
    background: var(--theme-bg);
    color: var(--theme-color);
    border: 1px solid var(--theme-color);
    padding: 4px 8px;
    font-size: 0.75rem;
    border-radius: 4px;
    cursor: pointer;
  }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 15px;
    flex-grow: 1;
  }
  .jarvis-core {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    cursor: pointer;
  }
  .ring { position: absolute; border-radius: 50%; }
  .ring-1 {
    width: 135px; height: 135px;
    border: 3px solid transparent;
    border-top: 3px solid var(--theme-color);
    border-bottom: 3px solid var(--theme-color);
    animation: spin 6s linear infinite;
    box-shadow: 0 0 15px var(--theme-glow);
  }
  .ring-2 {
    width: 105px; height: 105px;
    border: 2px dashed var(--theme-color);
    animation: spin-rev 4s linear infinite;
  }
  .core-center {
    width: 60px; height: 60px;
    background: radial-gradient(circle, #ffffff, var(--theme-color), #001f3f);
    border-radius: 50%;
    box-shadow: 0 0 25px var(--theme-color);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #050a14;
    font-weight: bold;
    font-size: 0.65rem;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes spin-rev { 100% { transform: rotate(-360deg); } }

  .chat-box {
    width: 100%;
    max-width: 500px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--theme-glow);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
  }
  #jarvis-msg {
    font-size: 0.95rem;
    color: #ffffff;
    min-height: 45px;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input {
    flex-grow: 1;
    padding: 10px;
    background: #02050a;
    border: 1px solid var(--theme-color);
    color: #fff;
    border-radius: 5px;
    outline: none;
  }
  .btn-jarvis {
    padding: 10px 15px;
    background: var(--theme-color);
    color: #050a14;
    border: none;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
  }
  .section-label {
    font-size: 0.7rem;
    letter-spacing: 1px;
    opacity: 0.8;
    margin: 10px 0 6px;
    text-transform: uppercase;
  }
  .quick-cmds {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .cmd-chip {
    padding: 5px 10px;
    background: var(--theme-bg);
    border: 1px solid var(--theme-glow);
    font-size: 0.75rem;
    cursor: pointer;
    border-radius: 15px;
  }
  .notes-area {
    width: 100%;
    max-width: 500px;
    text-align: left;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--theme-glow);
    padding: 10px;
    border-radius: 8px;
    font-size: 0.8rem;
  }
  .notes-area ul { list-style: none; margin-top: 5px; }
  .notes-area li {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  footer {
    text-align: center;
    padding: 10px;
    border-top: 1px solid var(--theme-glow);
    font-size: 0.75rem;
  }
</style>
</head>
<body>
  <header>
    <div class="logo" id="user-title">J.A.R.V.I.S.</div>
    <div class="top-controls">
      <div class="theme-dot" style="background:#00f3ff;" onclick="setTheme('#00f3ff', 'rgba(0,243,255,0.12)', 'rgba(0,243,255,0.5)')" title="Jarvis Blue"></div>
      <div class="theme-dot" style="background:#ff2a2a;" onclick="setTheme('#ff2a2a', 'rgba(255,42,42,0.12)', 'rgba(255,42,42,0.5)')" title="Iron Man Red"></div>
      <div class="theme-dot" style="background:#00ff66;" onclick="setTheme('#00ff66', 'rgba(0,255,102,0.12)', 'rgba(0,255,102,0.5)')" title="Matrix Green"></div>
      <button class="api-btn" onclick="setupUser()">⚙️ SETUP</button>
    </div>
  </header>

  <section class="hero">
    <div class="jarvis-core" onclick="startVoice()">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="core-center">TAP MIC</div>
    </div>

    <div class="chat-box">
      <div id="jarvis-msg">System Online, Sir. Main aapki kya madad kar sakta hoon?</div>
      <div class="input-group">
        <input type="text" id="user-input" placeholder="Sawal puchein, hisab karein, ya 'play song'..." onkeypress="if(event.key==='Enter') processCommand()">
        <button class="btn-jarvis" onclick="processCommand()">SEND</button>
      </div>
      
      <div class="section-label">Social Media & Apps</div>
      <div class="quick-cmds">
        <div class="cmd-chip" onclick="openSite('Instagram', 'https://instagram.com')">Instagram</div>
        <div class="cmd-chip" onclick="openSite('WhatsApp', 'https://whatsapp.com')">WhatsApp</div>
        <div class="cmd-chip" onclick="openSite('YouTube', 'https://youtube.com')">YouTube</div>
        <div class="cmd-chip" onclick="openSite('Facebook', 'https://facebook.com')">Facebook</div>
        <div class="cmd-chip" onclick="openSite('X Twitter', 'https://x.com')">X</div>
        <div class="cmd-chip" onclick="openSite('Telegram', 'https://telegram.org')">Telegram</div>
        <div class="cmd-chip" onclick="openSite('Snapchat', 'https://snapchat.com')">Snapchat</div>
        <div class="cmd-chip" onclick="openSite('LinkedIn', 'https://linkedin.com')">LinkedIn</div>
      </div>

      <div class="section-label">Smart Commands</div>
      <div class="quick-cmds">
        <div class="cmd-chip" onclick="runQuick('time')">⏰ Time</div>
        <div class="cmd-chip" onclick="runQuick('weather')">🌦️ Mumbai Weather</div>
        <div class="cmd-chip" onclick="runQuick('play arijit singh songs')">🎵 Play Song</div>
        <div class="cmd-chip" onclick="runQuick('note: call home at 7pm')">📝 Add Note</div>
      </div>
    </div>

    <div class="notes-area">
      <strong>📌 SAVED NOTES (Sir's Memory):</strong>
      <ul id="notes-list"></ul>
    </div>
  </section>

  <footer>
    <span id="battery-status">BATTERY: CHECKING...</span> | <span id="clock">TIME: 00:00:00</span>
  </footer>

  <script>
    let userName = localStorage.getItem('jarvis_user') || 'Sir';
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let notes = JSON.parse(localStorage.getItem('jarvis_notes')) || ['Welcome to J.A.R.V.I.S. System'];

    function init() {
      document.getElementById('jarvis-msg').innerText = `Welcome back, ${userName}. All systems operational.`;
      renderNotes();
    }

    function setTheme(color, bg, glow) {
      document.documentElement.style.setProperty('--theme-color', color);
      document.documentElement.style.setProperty('--theme-bg', bg);
      document.documentElement.style.setProperty('--theme-glow', glow);
    }

    function setupUser() {
      const name = prompt("Apna naam likhein (jaise: Boss ya aapka naam):", userName);
      if (name) {
        userName = name;
        localStorage.setItem('jarvis_user', name);
      }
      const key = prompt("Asli AI chat ke liye apni Free Gemini API Key dalein (ya khali chhod dein):", apiKey);
      if (key !== null) {
        apiKey = key.trim();
        localStorage.setItem('gemini_api_key', apiKey);
      }
      speak(`Settings updated, ${userName}.`);
    }

    function speak(text) {
      document.getElementById('jarvis-msg').innerText = text;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(speech);
      }
    }

    function updateClock() {
      document.getElementById('clock').innerText = 'TIME: ' + new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    if ('getBattery' in navigator) {
      navigator.getBattery().then(b => {
        const up = () => document.getElementById('battery-status').innerText = 'BATTERY: ' + Math.round(b.level * 100) + '%';
        up(); b.addEventListener('levelchange', up);
      });
    }

    function renderNotes() {
      const list = document.getElementById('notes-list');
      list.innerHTML = notes.map((n, i) => `<li><span>• ${n}</span><span style="cursor:pointer;color:#ff4d4d;" onclick="delNote(${i})">✖</span></li>`).join('');
    }

    function delNote(index) {
      notes.splice(index, 1);
      localStorage.setItem('jarvis_notes', JSON.stringify(notes));
      renderNotes();
    }

    function runQuick(cmd) {
      document.getElementById('user-input').value = cmd;
      processCommand();
    }

    function openSite(name, url) {
