<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a14">
<title>J.A.R.V.I.S. Ultimate AI</title>
<style>
  :root {
    --theme-color: #00f3ff;
    --theme-bg: rgba(0, 243, 255, 0.12);
    --theme-glow: rgba(0, 243, 255, 0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #050a14;
    color: var(--theme-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background-image: radial-gradient(circle at center, var(--theme-bg) 0%, #050a14 80%);
    transition: 0.3s;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--theme-glow);
    position: relative;
    z-index: 10;
  }
  .logo {
    font-size: 1.3rem;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 10px var(--theme-color);
  }
  .top-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .theme-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #fff;
  }
  .api-btn {
    background: var(--theme-color);
    color: #050a14;
    border: none;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
  }

  /* On-Screen Settings Panel */
  #setup-panel {
    display: none;
    background: #081224;
    border: 2px solid var(--theme-color);
    padding: 15px;
    margin: 10px auto;
    width: 92%;
    max-width: 480px;
    border-radius: 10px;
    box-shadow: 0 0 25px var(--theme-glow);
    text-align: left;
  }
  #setup-panel label {
    display: block;
    font-size: 0.8rem;
    margin-bottom: 5px;
    color: #fff;
  }
  #setup-panel input {
    width: 100%;
    margin-bottom: 12px;
  }
  .setup-actions {
    display: flex;
    gap: 10px;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 15px;
    flex-grow: 1;
  }
  .jarvis-core {
    position: relative;
    width: 135px;
    height: 135px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    cursor: pointer;
  }
  .ring { position: absolute; border-radius: 50%; pointer-events: none; }
  .ring-1 {
    width: 130px; height: 130px;
    border: 3px solid transparent;
    border-top: 3px solid var(--theme-color);
    border-bottom: 3px solid var(--theme-color);
    animation: spin 6s linear infinite;
    box-shadow: 0 0 15px var(--theme-glow);
  }
  .ring-2 {
    width: 100px; height: 100px;
    border: 2px dashed var(--theme-color);
    animation: spin-rev 4s linear infinite;
  }
  .core-center {
    width: 62px; height: 62px;
    background: radial-gradient(circle, #ffffff, var(--theme-color), #001f3f);
    border-radius: 50%;
    box-shadow: 0 0 25px var(--theme-color);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #050a14;
    font-weight: bold;
    font-size: 0.7rem;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes spin-rev { 100% { transform: rotate(-360deg); } }

  .chat-box {
    width: 100%;
    max-width: 500px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--theme-glow);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
  }
  #jarvis-msg {
    font-size: 0.95rem;
    color: #ffffff;
    min-height: 45px;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input {
    flex-grow: 1;
    padding: 10px;
    background: #02050a;
    border: 1px solid var(--theme-color);
    color: #fff;
    border-radius: 5px;
    outline: none;
    font-size: 0.9rem;
  }
  .btn-jarvis {
    padding: 10px 15px;
    background: var(--theme-color);
    color: #050a14;
    border: none;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
  }
  .section-label {
    font-size: 0.7rem;
    letter-spacing: 1px;
    opacity: 0.85;
    margin: 12px 0 6px;
    text-transform: uppercase;
  }
  .quick-cmds {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    justify-content: center;
  }
  .cmd-chip {
    padding: 7px 12px;
    background: var(--theme-bg);
    border: 1px solid var(--theme-glow);
    color: var(--theme-color);
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 15px;
    text-decoration: none;
    display: inline-block;
  }
  .cmd-chip:active {
    background: var(--theme-color);
    color: #050a14;
  }
  .notes-area {
    width: 100%;
    max-width: 500px;
    text-align: left;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--theme-glow);
    padding: 12px;
    border-radius: 8px;
    font-size: 0.85rem;
  }
  .notes-area ul { list-style: none; margin-top: 6px; }
  .notes-area li {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  footer {
    text-align: center;
    padding: 10px;
    border-top: 1px solid var(--theme-glow);
    font-size: 0.75rem;
  }
</style>
</head>

  </section>

  <footer>
