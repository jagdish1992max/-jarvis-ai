<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #050a14;
    color: #00f3ff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background-image: radial-gradient(circle at center, rgba(0, 243, 255, 0.15) 0%, #050a14 75%);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    border-bottom: 1px solid rgba(0, 243, 255, 0.3);
  }
  .logo {
    font-size: 1.5rem;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 0 10px #00f3ff;
  }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px;
    flex-grow: 1;
    justify-content: center;
  }
  .jarvis-core {
    position: relative;
    width: 170px;
    height: 170px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    cursor: pointer;
  }
  .ring { position: absolute; border-radius: 50%; }
  .ring-1 {
    width: 160px; height: 160px;
    border: 3px solid transparent;
    border-top: 3px solid #00f3ff;
    border-bottom: 3px solid #00f3ff;
    animation: spin 6s linear infinite;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
  }
  .ring-2 {
    width: 125px; height: 125px;
    border: 3px dashed #00f3ff;
    animation: spin-rev 4s linear infinite;
  }
  .core-center {
    width: 70px; height: 70px;
    background: radial-gradient(circle, #ffffff, #00f3ff, #0051ff);
    border-radius: 50%;
    box-shadow: 0 0 30px #00f3ff;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #050a14;
    font-weight: bold;
    font-size: 0.75rem;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes spin-rev { 100% { transform: rotate(-360deg); } }

  .chat-box {
    width: 100%;
    max-width: 480px;
    background: rgba(0, 243, 255, 0.05);
    border: 1px solid rgba(0, 243, 255, 0.3);
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
  }
  #jarvis-msg {
    font-size: 1rem;
    color: #e0f7fa;
    min-height: 45px;
    margin-bottom: 15px;
  }
  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
  }
  input {
    flex-grow: 1;
    padding: 10px;
    background: #02050a;
    border: 1px solid #00f3ff;
    color: #00f3ff;
    border-radius: 4px;
    outline: none;
  }
  .btn-jarvis {
    padding: 10px 15px;
    background: #00f3ff;
    color: #050a14;
    border: none;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
  }
  .section-label {
    font-size: 0.75rem;
    letter-spacing: 1px;
    color: #5bc0de;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .quick-cmds {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .cmd-chip {
    padding: 6px 12px;
    background: rgba(0, 243, 255, 0.1);
    border: 1px solid rgba(0, 243, 255, 0.4);
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 20px;
    transition: 0.2s;
  }
  .cmd-chip:active {
    background: #00f3ff;
    color: #050a14;
  }
  footer {
    text-align: center;
    padding: 12px;
    border-top: 1px solid rgba(0, 243, 255, 0.3);
    font-size: 0.8rem;
    color: #5bc0de;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div id="battery-status" style="font-size: 0.8rem;">SYSTEM READY</div>
  </header>

  <section class="hero">
    <div class="jarvis-core" onclick="startVoice()">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="core-center">TAP MIC</div>
    </div>

    <div class="chat-box">
      <div id="jarvis-msg">System Online, Sir. Kaunsa platform kholna hai?</div>
      <div class="input-group">
        <input type="text" id="user-input" placeholder="Likhein: open instagram, whatsapp..." onkeypress="if(event.key==='Enter') processCommand()">
        <button class="btn-jarvis" onclick="processCommand()">SEND</button>
      </div>
      
      <div class="section-label">Social Media & Quick Access</div>
      <div class="quick-cmds">
        <div class="cmd-chip" onclick="runQuick('instagram')">Instagram</div>
        <div class="cmd-chip" onclick="runQuick('whatsapp')">WhatsApp</div>
        <div class="cmd-chip" onclick="runQuick('youtube')">YouTube</div>
        <div class="cmd-chip" onclick="runQuick('facebook')">Facebook</div>
        <div class="cmd-chip" onclick="runQuick('twitter')">X (Twitter)</div>
        <div class="cmd-chip" onclick="runQuick('telegram')">Telegram</div>
        <div class="cmd-chip" onclick="runQuick('snapchat')">Snapchat</div>
        <div class="cmd-chip" onclick="runQuick('linkedin')">LinkedIn</div>
        <div class="cmd-chip" onclick="runQuick('google')">Google</div>
        <div class="cmd-chip" onclick="runQuick('time')">Time Batao</div>
      </div>
    </div>
  </section>

  <footer>
    <div id="clock">TIME: 00:00:00</div>
    <div>STARK INDUSTRIES INTERFACE</div>
  </footer>

  <script>
    function speak(text) {
      document.getElementById('jarvis-msg').innerText = text;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(speech);
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = 'TIME: ' + now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    if ('getBattery' in navigator) {
      navigator.getBattery().then(battery => {
        const updateBat = () => {
          document.getElementById('battery-status').innerText = 'BATTERY: ' + Math.round(battery.level * 100) + '%';
        };
        updateBat();
        battery.addEventListener('levelchange', updateBat);
      });
    }

    function runQuick(cmd) {
      document.getElementById('user-input').value = cmd;
      processCommand();
    }

    function openSite(name, url) {
      speak(name + " khol raha hoon, Sir.");
      setTimeout(() => window.open(url, '_blank'), 800);
    }

    function processCommand() {
      const input = document.getElementById('user-input');
      const cmd = input.value.toLowerCase().trim();
      input.value = '';

      if (!cmd) return;

      if (cmd.includes('hello') || cmd.includes('hi')) {
        speak("Hello Sir! Main aapki kya madad kar sakta hoon?");
      } else if (cmd.includes('time')) {
        speak("Abhi samay hua hai " + new Date().toLocaleTimeString());
      } else if (cmd.includes('instagram') || cmd.includes('insta')) {
        openSite("Instagram", "https://instagram.com");
      } else if (cmd.includes('whatsapp')) {
        openSite("WhatsApp", "https://whatsapp.com");
      } else if (cmd.includes('youtube')) {
        openSite("YouTube", "https://youtube.com");
      } else if (cmd.includes('facebook') || cmd.includes('fb')) {
        openSite("Facebook", "https://facebook.com");
      } else if (cmd.includes('twitter') || cmd.includes('x')) {
        openSite("X Twitter", "https://x.com");
      } else if (cmd.includes('telegram')) {
        openSite("Telegram", "https://telegram.org");
      } else if (cmd.includes('snapchat') || cmd.includes('snap')) {
        openSite("Snapchat", "https://snapchat.com");
      } else if (cmd.includes('linkedin')) {
        openSite("LinkedIn", "https://linkedin.com");
      } else if (cmd.includes('google')) {
        openSite("Google", "https://google.com");
      } else if (cmd.includes('status')) {
        speak("Saare systems normal hain. Internet connection active hai.");
      } else {
        speak("Google par search kar raha hoon: " + cmd);
        setTimeout(() => window.open('https://google.com/search?q=' + encodeURIComponent(cmd), '_blank'), 800);
      }
    }

    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        speak("Aapke browser mein voice mic support nahi hai, kripya niche type karein.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-IN';
      document.getElementById('jarvis-msg').innerText = "Listening... Boliye Sir...";
      recognition.start();

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('user-input').value = transcript;
        processCommand();
      };
    }
  </script>
</body>
</html>
